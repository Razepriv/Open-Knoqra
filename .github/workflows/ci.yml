# The public repository's CI (written by scripts/export from the private repo's overlay).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Admin role: migrations and test setup. Runtime and tests use the non-superuser app role.
      MIGRATION_DATABASE_URL: postgres://knoqra:knoqra@localhost:54329/knoqra
      DATABASE_URL: postgres://knoqra_app:knoqra_app@localhost:54329/knoqra
      CI: "true"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: knoqra
          POSTGRES_USER: knoqra
          POSTGRES_PASSWORD: knoqra
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U knoqra -d knoqra"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check ascii-reveal imports
        run: pnpm check:imports

      - name: Check placeholder copy
        run: pnpm check:placeholders

      - name: Check the edition boundary
        run: pnpm check:editions

      - name: Test repo scripts
        run: pnpm test:scripts

      - name: Typecheck
        run: pnpm typecheck

      - name: Check docs and tracker files
        run: pnpm docs:check

      # The service container cannot mount docker/postgres/init, so create the app role here.
      - name: Create app role
        run: psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f docker/postgres/init/01-app-role.sql

      - name: Migrate database
        run: pnpm --filter @knoqra/db migrate

      - name: Test
        run: pnpm test

      - name: Check generated API client is up to date
        run: pnpm api:generate && git diff --exit-code packages/api-client && test -z "$(git status --porcelain packages/api-client)"

      - name: Write API dev vars for E2E
        run: |
          {
            echo "BETTER_AUTH_URL=http://localhost:5173"
            echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)"
            echo "FAKE_WEBHOOK_SECRET=$(openssl rand -base64 32)"
            echo "CREDENTIALS_MASTER_KEY=$(openssl rand -base64 32)"
            echo "DATABASE_URL=$DATABASE_URL"
          } > apps/api/.dev.vars

      - name: Build web
        run: pnpm --filter @knoqra/web build

      - name: Scan web build for secrets
        run: pnpm --filter @knoqra/web check:secrets

      - name: Install Playwright browser
        run: pnpm --filter @knoqra/web exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm --filter @knoqra/web e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
