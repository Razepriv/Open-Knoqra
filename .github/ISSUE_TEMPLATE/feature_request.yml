name: Feature request
description: Suggest an improvement or a new capability
title: "feat: "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Check the [roadmap](https://github.com/Razepriv/Open-Knoqra/blob/main/ROADMAP.md) first: it may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to see? Sketches and examples help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you thought about.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - web
        - api
        - db
        - providers
        - ui
        - telephony
        - messaging
        - billing
        - compliance
        - ai
        - infra
        - mobile
        - extension
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Roadmap phase
      description: "P1 personal communications, P2 teams and billing, P3 AI go-to-market, P4 revenue operations."
      options:
        - P1
        - P2
        - P3
        - P4
    validations:
      required: true
