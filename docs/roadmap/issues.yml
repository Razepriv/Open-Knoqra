  - title: Phone Inbox shifts as the thread list loads
    milestone: M6 Hardening
    labels:
      - type:bug
      - area:web
      - area:messaging
      - priority:p2
      - phase:1
      - status:needs-design
    body: |
      ## Context

      Below 1024px the Inbox stacks the thread list above the conversation, and the list's height
      follows its row count. The outline cannot know that count, so content under the list moves
      when it loads. `e2e/skeletons.spec.ts` measures CLS 0.25 on the list and 0.34 with a thread
      open at 390px (the budget is 0.01). It records this as an annotation, not a failure.

      ## Scope

      - Decide the phone layout: a list with a fixed, scrolling height, or the list and the open
        thread as separate views
      - Make the outline match, and turn the spec annotation into an assertion

      ## Acceptance criteria

      - [ ] Phone Inbox CLS at most 0.01 in `e2e/skeletons.spec.ts`, list and open thread

      ## Spec reference

      `docs/quality.md`, "Skeletons".
