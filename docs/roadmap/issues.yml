  - title: "Rapid toggling of two preferences can briefly revert one"
    milestone: M6 Hardening
    labels:
      - type:bug
      - area:web
      - priority:p2
      - phase:1
    body: |
      ## Context

      On Settings, toggling email then desktop notifications quickly fires two `PATCH /me/prefs` requests. The first one's settle refetch can land before the second save and briefly show the second checkbox in its old state.

      ## Scope

      - Serialise preference saves, or skip the settle refetch while another save is in flight

      ## Acceptance criteria

      - [ ] Two quick toggles never show a reverted state, including on a slow server
