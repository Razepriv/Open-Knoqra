  - title: "Harden deploy trust boundary before enabling DEPLOY_ENABLED"
    milestone: M6 Hardening
    labels:
      - type:security
      - area:infra
      - priority:p0
      - phase:1
    body: |
      ## Context

      The deploy workflow holds Cloudflare and database owner credentials. Before the repository variable `DEPLOY_ENABLED` is set to `true`, the trust boundary around those credentials must be tightened.

      ## Scope

      - Move `CLOUDFLARE_API_TOKEN`, `CLOUDFLARE_ACCOUNT_ID` and `MIGRATION_DATABASE_URL_<ENV>` to environment secrets on the `staging` and `production` GitHub environments
      - Require reviewers on the `production` environment
      - Add a tag ruleset restricting who can create `v*` tags
      - Pin `cloudflare/wrangler-action` (and other third-party actions) to full commit SHAs

      ## Acceptance criteria

      - [ ] No deploy credential exists as a repository secret
      - [ ] A production deploy waits for a required reviewer
      - [ ] Only the intended people can create `v*` tags
      - [ ] All third-party actions in deploy.yml are pinned to SHAs

      ## Spec reference

      `docs/superpowers/specs/2026-11-11-knoqra-phase1-design.md`, "Build milestones" (M6).
