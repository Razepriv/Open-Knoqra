      - Generate the linux set on CI's image and commit it, so CI guards visuals

      ## Acceptance criteria

      - [ ] `__baselines__/darwin/` and `__baselines__/linux/` committed, each passing twice with zero diff
      - [ ] CI runs the `visual` project

      ## Spec reference

      `docs/quality.md`, "Visual baselines".
  - title: Durable Better Auth rate limiting and the cf-connecting-ip header
    milestone: M6 Hardening
    labels:
      - type:security
      - area:api
      - area:infra
      - priority:p0
      - phase:1
    body: |
      ## Context

      Pre-production blocker. Better Auth uses an in-memory rate limiter, which is per isolate and resets often. It also has no trusted client IP header configured on Cloudflare.

      ## Scope

      - Back the limiter with durable storage (the Workers Rate Limiting binding, a Durable Object or a database table)
      - Configure Better Auth to read the client IP from `cf-connecting-ip`
      - Limit sign-in, sign-up and password reset more strictly
      - Document the bindings in docs/deploy.md and the wrangler env blocks

      ## Acceptance criteria

      - [ ] Repeated failed sign-ins are limited across isolates
      - [ ] Spoofed forwarding headers do not change the client identity
      - [ ] Tests cover both limits and the header

      ## Spec reference

      `docs/superpowers/specs/2026-11-11-knoqra-phase1-design.md`, "Tech stack".
