# Tracker seed: GitHub milestones and issues.
# Schema: milestones: [{title, description, due_on?}], issues: [{title, milestone, labels, body}].
# Every issue's milestone must match a milestone title, and every label must exist in
# .github/labels.yml. `pnpm docs:check` enforces both.

milestones:
  - title: M0 Foundation
    description: Monorepo, CI and deploy pipeline, design tokens and UI kit, tenant-scoped schema with row-level security, auth and personal workspaces, Hono API, webhook ingest and queue, OpenAPI client, fake provider.
  - title: M1 Desk shell & contacts
    description: App shell (rail, header, theme), Contacts, Contact 360 with timeline, consent and provenance, duplicate suggestion, CSV import, plus the sign-in, reset, MFA and settings screens.
  - title: M2 Voice
    description: Telnyx credentials and WebRTC token, dialer states, live panel, call dock, outcomes, voicemail, webhook to queue to normalization to Durable Object fan-out, ledger reserve, capture and release, WARN and STOP caps.
  - title: M3 Inbox (SMS & WhatsApp)
    description: SMS and WhatsApp threads, composer states (free, template, paused, blocked), delivery status chain, internal notes. Live sending is gated behind 10DLC registration and Meta approval.
  - title: M4 Numbers & usage
    description: Numbers setup checks and capability tiles, Telnyx balance polling, Usage page and ledger with CSV export, daily reconciliation, first-run setup wizard.
  - title: M5 Today & Otto
    description: Today screen (week grid, streak, heatmap, goal ring, focus timer, widgets), tasks, notifications, command palette, and the Otto assistant on a mock AI provider.
  - title: M6 Hardening
    description: Full E2E matrix, accessibility pass, security review, state coverage for every view, and a small live telephony test on owner-authorized numbers.
issues:
  - title: "M0 Foundation: monorepo, auth, tenancy, webhooks, Desk shell"
    milestone: M0 Foundation
    labels:
      - type:feature
      - area:infra
      - priority:p1
      - phase:1
    body: |
      ## Context

      The base everything else builds on. It shipped as milestone M0 and is in review; this issue tracks it and is closed when the foundation lands on main.

      ## Scope

      - pnpm and Turborepo monorepo with Biome, Vitest and Playwright
      - Tenant-scoped schema with forced row-level security and the `knoqra_app` runtime role
      - Better Auth with personal workspaces, Hono API, contacts endpoints and audit events
      - Idempotent webhook ingest, provider-events queue with a dead-letter queue, fake provider
      - OpenAPI spec and generated typed client
      - Design tokens, UI kit including `Skeleton` and `Reveal`, Desk shell with sign-in and sign-up
      - CI and gated Cloudflare and Neon deploy workflows

      ## Acceptance criteria

      - [ ] CI is green on main
      - [ ] Docs, templates and the roadmap are in the repository
      - [ ] Staging deploy verified with `DEPLOY_ENABLED` set (see docs/deploy.md)

      ## Spec reference

      `docs/superpowers/specs/2026-11-11-knoqra-phase1-design.md`, "Build milestones" (M0).
  - title: "App shell: navigation rail, header and theme persistence"
    milestone: M1 Desk shell & contacts
    labels:
      - type:feature
      - area:web
      - area:ui
      - priority:p1
      - phase:1
    body: |
      ## Context

      The Desk currently has a home route and a component showcase. Every later screen lives inside a shared shell.

      ## Scope

      - Responsive layout: three panes at 1280px and wider, the context ribbon as a drawer from 1024 to 1279px, one column below 1024px
      - Navigation rail, header with workspace label and user menu
      - Light and dark theme toggle that persists per user
      - Route stubs for Contacts, Inbox, Calls, Numbers, Usage and Today with Skeleton loading states

      ## Acceptance criteria

      - [ ] Layout matches the design at all three breakpoints
      - [ ] Theme choice survives reload and uses design tokens only
      - [ ] Keyboard navigation reaches the rail and header
      - [ ] Playwright test covers navigation and theme persistence

      ## Spec reference

      `docs/superpowers/specs/2026-11-11-knoqra-phase1-design.md`, "Build milestones" (M1).
  - title: Contacts list view
    milestone: M1 Desk shell & contacts
    labels:
      - type:feature
      - area:web
      - priority:p1
      - phase:1
    body: |
      ## Context

      The API returns contacts for the active organization; the Desk has no UI for them yet.

      ## Scope

      - Searchable, sortable list on top of `GET /api/v1/contacts`
      - Create-contact dialog with phone and time zone validation and the API error messages
      - Empty, loading (`Skeleton`, `Reveal`) and error states
      - Wire to the pagination work in the "Contacts list pagination" issue

      ## Acceptance criteria

      - [ ] A new contact appears in the list without a reload
      - [ ] Duplicate and invalid phone numbers show a clear inline error
      - [ ] Loading uses `Skeleton` and `Reveal` only
      - [ ] Playwright test covers create and list

      ## Spec reference

      `docs/superpowers/specs/2026-11-11-knoqra-phase1-design.md`, "Build milestones" (M1).
  - title: "Contact 360: timeline, consent and provenance"
    milestone: M1 Desk shell & contacts
    labels:
      - type:feature
      - area:web
      - area:api
      - area:db
      - priority:p1
      - phase:1
    body: |
      ## Context

      A contact page is the hub for calls, messages and notes. It needs a timeline projection and shows where each fact came from.

      ## Scope

      - `GET /api/v1/contacts/{id}` detail view with edit and archive
      - Timeline event model (projection) and read endpoint, tenant-scoped with forced RLS
      - Provenance: source of the contact and of each consent record
      - Placeholder timeline entries that M2 and M3 fill with calls and messages

      ## Acceptance criteria

      - [ ] New tables have forced RLS and isolation tests
      - [ ] Cross-tenant access returns 404 and writes an audit row
      - [ ] Page handles empty, loading, error and permission-denied states
      - [ ] OpenAPI client regenerated

      ## Spec reference

      `docs/superpowers/specs/2026-11-11-knoqra-phase1-design.md`, "Build milestones" (M1).
  - title: Per-channel contact permissions (consent)
    milestone: M1 Desk shell & contacts
    labels:
      - type:feature
      - area:db
      - area:api
      - area:compliance
      - priority:p1
      - phase:1
    body: |
      ## Context

      Consent and eligibility are enforced on the server. Permissions are stored per contact and per channel: manual call, SMS, WhatsApp, AI voice and recording.

      ## Scope

      - `contact_permission_event`: an append-only table with forced RLS, one row per grant or revocation with source, evidence and timestamp (the current state is the latest event per channel)
      - Endpoints to read and change permissions, audited
      - Policy helper in `packages/core` that answers "may we use this channel for this contact"
      - Consent row UI in Contact 360

      ## Acceptance criteria

      - [ ] Revocation takes effect immediately for later checks
      - [ ] Every change writes an audit event
      - [ ] Unit tests cover the policy helper, integration tests cover isolation

      ## Spec reference

      `docs/superpowers/specs/2026-11-11-knoqra-phase1-design.md`, "Build milestones" (M1).
  - title: Duplicate contact suggestion
    milestone: M1 Desk shell & contacts
    labels:
      - type:feature
      - area:web
      - area:api
      - priority:p1
      - phase:1
    body: |
      ## Context

      Phone numbers are unique per organization, but the same person can arrive under a different number or spelling.

      ## Scope

      - Suggest likely duplicates by name and email (phone numbers are already unique per organization)
      - Merge flow that keeps provenance and re-points timeline entries
      - Dismiss a suggestion permanently

      ## Acceptance criteria

      - [ ] Merge is atomic and audited
      - [ ] Dismissed suggestions do not return
      - [ ] Tests cover merge isolation between tenants

      ## Spec reference

      `docs/superpowers/specs/2026-11-11-knoqra-phase1-design.md`, "Build milestones" (M1).
  - title: CSV contact import with field mapping
    milestone: M1 Desk shell & contacts
    labels:
      - type:feature
      - area:web
      - area:api
      - priority:p1
      - phase:1
    body: |
      ## Context

      Users bring existing contact lists. Import must map arbitrary columns and report problems row by row.

      ## Scope

      - Upload and preview, then map columns to contact fields
      - Server-side validation with E.164 normalization and per-row error report
      - Duplicate handling: skip or update, chosen by the user
      - Parse in the browser and send batches of 500 rows to the API. Storing the file in R2 and processing it asynchronously is deferred until files outgrow the browser

      ## Acceptance criteria

      - [ ] A 5,000-row file imports without timing out
      - [ ] Rejected rows can be downloaded as CSV
      - [ ] Imported contacts record `source = import`
      - [ ] Tests include malformed and hostile files

      ## Spec reference

      `docs/superpowers/specs/2026-11-11-knoqra-phase1-design.md`, "Build milestones" (M1).
  - title: Password reset and two-factor screens
    milestone: M1 Desk shell & contacts
    labels:
      - type:feature
      - area:web
      - priority:p1
      - phase:1
    body: |
      ## Context

      The server supports password reset and the two-factor plugin; the Desk has only sign-in and sign-up.

      ## Scope

      - Forgot-password and reset-password screens
      - TOTP setup with QR code and backup codes, and the sign-in challenge
      - Error states mapped through the existing auth error helper

      ## Acceptance criteria

      - [ ] A user can enable and use TOTP end to end
      - [ ] Reset flow works once the email sender issue is done
      - [ ] Playwright test covers TOTP with a generated code

      ## Spec reference

      `docs/superpowers/specs/2026-11-11-knoqra-phase1-design.md`, "UI the designs don't cover".
  - title: "Settings: profile, time zone, devices and notifications"
    milestone: M1 Desk shell & contacts
    labels:
      - type:feature
      - area:web
      - area:api
      - priority:p1
      - phase:1
    body: |
      ## Context

      Users need to manage their own account and see where they are signed in.

      ## Scope

      - Profile and time zone
      - Session and device list with revoke
      - Notification preferences and theme

      ## Acceptance criteria

      - [ ] Revoking a session signs that device out on its next request
      - [ ] Time zone is validated as an IANA zone
      - [ ] Settings page has empty, loading and error states

      ## Spec reference

      `docs/superpowers/specs/2026-11-11-knoqra-phase1-design.md`, "UI the designs don't cover".
  - title: Contacts list pagination
    milestone: M1 Desk shell & contacts
    labels:
      - type:feature
      - area:api
      - area:web
      - priority:p1
      - phase:1
    body: |
      ## Context

      `GET /api/v1/contacts` returns every contact of the organization. That does not scale.

      ## Scope

      - Cursor pagination on `(display_name, id)` with a bounded page size
      - Update the OpenAPI schema and regenerate the client
      - Infinite scroll or paging in the list view

      ## Acceptance criteria

      - [ ] Default and maximum page sizes are documented
      - [ ] Ordering is stable across pages
      - [ ] Isolation test confirms pages never cross tenants

      ## Spec reference

      `docs/superpowers/specs/2026-11-11-knoqra-phase1-design.md`, "Build milestones" (M1).
  - title: Real email sender (Resend) for password reset
    milestone: M1 Desk shell & contacts
    labels:
      - type:security
      - area:api
      - area:infra
      - priority:p0
      - phase:1
    body: |
      ## Context

      Pre-production blocker. Staging and production use `unconfiguredEmailSender`, which only logs an error, so password reset cannot work when deployed.

      ## Scope

      - Implement an `EmailSender` that calls the Resend HTTP API with `fetch`
      - Select it for staging and production in `emailSenderFor`, keep the logging sender for development
      - Add the Resend API key as a Worker secret and document it in docs/deploy.md
      - Never log message bodies: reset links are bearer credentials

      ## Acceptance criteria

      - [ ] A password reset email arrives in staging
      - [ ] Failures are logged without the link and surface as a generic response
      - [ ] Unit test covers the sender with a mocked `fetch`
      - [ ] docs/deploy.md lists the new secret

      ## Spec reference

      `docs/superpowers/specs/2026-11-11-knoqra-phase1-design.md`, "Tech stack".
  - title: Disable organization deletion and invite endpoints until teams ship
    milestone: M1 Desk shell & contacts
    labels:
      - type:security
      - area:api
      - priority:p1
      - phase:1
    body: |
      ## Context

      Better Auth mounts the organization plugin routes, including invitations and organization deletion. In Phase 1 each user has one personal workspace, so invitations should not be reachable, and a user must not be able to delete their only workspace.

      ## Scope

      - Block or remove invite, member, organization deletion and other organization management routes under `/api/auth`
      - Keep the routes the Desk actually needs (session and active organization)
      - Re-enable deliberately in Phase 2

      ## Acceptance criteria

      - [ ] Calls to the invite and organization deletion endpoints return 404 or 403
      - [ ] A regression test lists the blocked paths
      - [ ] Sign-up and workspace creation still work

      ## Spec reference

      `docs/superpowers/specs/2026-11-11-knoqra-phase1-design.md`, "Build milestones" (M1).
  - title: Server-side merge history on the contact
    milestone: M6 Hardening
    labels:
      - type:feature
      - area:api
      - area:web
      - priority:p2
      - phase:1
    body: |
      ## Context

      Contact 360 shows past merges by scanning the contact's timeline for merge events, up to 1,000 events. A contact with a longer timeline can hide old merge provenance.

      ## Scope

      - Return the contacts merged into a contact (`mergedFrom`) from the contact detail endpoint
      - Use it in the Contact 360 provenance panel and drop the client-side scan

      ## Acceptance criteria

      - [ ] Merge history is complete however long the timeline is
      - [ ] The detail endpoint stays tenant-scoped and audited
      - [ ] OpenAPI client regenerated

      ## Spec reference

      `docs/superpowers/specs/2026-11-11-knoqra-phase1-design.md`, "Build milestones" (M1).
  - title: Enable Biome css.parser.tailwindDirectives and fold tailwind-sources.pcss into styles.css
    milestone: M1 Desk shell & contacts
    labels:
      - type:chore
      - area:web
      - priority:p1
      - phase:1
      - good first issue
    body: |
      ## Context

      Biome could not parse Tailwind directives, so `@source` lives in `apps/web/src/tailwind-sources.pcss` as a workaround. Newer Biome versions can parse them with `css.parser.tailwindDirectives`.

      ## Scope

      - Enable the option in `biome.json` once the installed Biome supports it
      - Move the `@source` line back into `styles.css` and delete the `.pcss` file and its import
      - Update the troubleshooting note in docs/development.md

      ## Acceptance criteria

      - [ ] `pnpm lint` passes
      - [ ] The Tailwind build still picks up classes from `packages/ui`
      - [ ] No `.pcss` workaround remains

      ## Spec reference

      `docs/superpowers/specs/2026-11-11-knoqra-phase1-design.md`, "Tech stack".
  - title: Telnyx credentials and short-lived WebRTC token
    milestone: M2 Voice
    labels:
      - type:feature
      - area:api
      - area:telephony
      - area:providers
      - priority:p1
      - phase:1
    body: |
      ## Context

      The browser dials through the Telnyx WebRTC client, which must only ever receive a short-lived token.

      ## Scope

      - Store per-organization provider credentials with AES-GCM envelope encryption, show only the last four characters
      - Endpoint that mints a short-lived client token through `VoiceProvider.createClientSession`
      - Platform key stays a Worker secret and never reaches the web build

      ## Acceptance criteria

      - [ ] No secret appears in logs, responses or the web bundle (`check:secrets` still passes)
      - [ ] Token expiry is enforced and tested
      - [ ] Credentials are tenant-scoped with forced RLS

      ## Spec reference

      `docs/superpowers/specs/2026-11-11-knoqra-phase1-design.md`, "Build milestones" (M2).
  - title: TelnyxProvider voice adapter and webhook adapter
    milestone: M2 Voice
    labels:
      - type:feature
      - area:providers
      - area:telephony
      - priority:p1
      - phase:1
    body: |
      ## Context

      Only the fake provider exists. Real calls need a Telnyx implementation of the provider interfaces.

      ## Scope

      - Implement `VoiceProvider` and `WebhookAdapter` for Telnyx behind `@knoqra/providers`
      - Register `telnyx` in `/webhooks/:provider` alongside `fake`
      - Ed25519 signature verification with WebCrypto and a timestamp window
      - Contract tests shared with the fake provider

      ## Acceptance criteria

      - [ ] App code imports only the interfaces
      - [ ] Bad signatures and stale timestamps are rejected
      - [ ] Tests run without network access

      ## Spec reference

      `docs/superpowers/specs/2026-11-11-knoqra-phase1-design.md`, "Tech stack".
  - title: Call state machine in packages/core
    milestone: M2 Voice
    labels:
      - type:feature
      - area:telephony
      - priority:p1
      - phase:1
    body: |
      ## Context

      Call state must be deterministic and testable apart from any provider.

      ## Scope

      - States: queued, initiating, ringing, connected, ending, completed, plus failed, busy, no_answer, canceled
      - Pure transition function with illegal transitions rejected
      - Test-first, property tests for ordering and duplicates

      ## Acceptance criteria

      - [ ] Every transition is covered by a test
      - [ ] Out-of-order provider events do not corrupt state
      - [ ] Coverage on the module is at least 80%

      ## Spec reference

      `docs/superpowers/specs/2026-11-11-knoqra-phase1-design.md`, "Build milestones" (M2).
  - title: Normalize provider events into calls and call events
    milestone: M2 Voice
    labels:
      - type:feature
      - area:api
      - area:db
      - area:telephony
      - priority:p1
      - phase:1
    body: |
      ## Context

      The queue consumer currently only sets `processed_at`. It should turn raw events into domain records.

      ## Scope

      - `Call` and `CallEvent` tables with forced RLS
      - Resolve the owning organization from the number or call, then write inside `withTenant`
      - Keep the consumer idempotent: a redelivery changes nothing
      - Fan out to the realtime Durable Object after commit

      ## Acceptance criteria

      - [ ] Replaying the same event produces one call event
      - [ ] Unknown calls are parked, not dropped
      - [ ] Dead-lettered messages are inspectable

      ## Spec reference

      `docs/superpowers/specs/2026-11-11-knoqra-phase1-design.md`, "Build milestones" (M2).
  - title: "Realtime Durable Objects: OrgRealtime and UserCallLock"
    milestone: M2 Voice
    labels:
      - type:feature
      - area:api
      - area:infra
      - area:telephony
      - priority:p1
      - phase:1
    body: |
      ## Context

      The Desk needs live call and message updates, and one user must not hold two active calls.

      ## Scope

      - `OrgRealtime` with WebSocket hibernation, fan-out per organization
      - `UserCallLock` enforcing one active call per user
      - Client subscription that updates the TanStack Query cache
      - Authenticate the socket with the session and re-check membership

      ## Acceptance criteria

      - [ ] A second dial attempt is rejected while a call is active
      - [ ] Idle sockets cost nothing (hibernation)
      - [ ] A user cannot subscribe to another organization

      ## Spec reference

      `docs/superpowers/specs/2026-11-11-knoqra-phase1-design.md`, "Tech stack".
  - title: Dialer, live call panel, call dock and outcomes
    milestone: M2 Voice
    labels:
      - type:feature
      - area:web
      - area:telephony
      - priority:p1
      - phase:1
    body: |
      ## Context

      The core calling experience in the Desk.

      ## Scope

      - Dialer states: plain, blocked and review
      - Live panel, call dock, mute and hang up, microphone permission handling
      - Outcome logging and voicemail playback
      - Keyboard-operable dialer

      ## Acceptance criteria

      - [ ] Blocked numbers explain why, using server-side policy results
      - [ ] Mic denied shows a recoverable state
      - [ ] E2E covers a fake inbound call to outcome to timeline event

      ## Spec reference

      `docs/superpowers/specs/2026-11-11-knoqra-phase1-design.md`, "Build milestones" (M2).
  - title: "Ledger: reserve, capture, release and spend caps"
    milestone: M2 Voice
    labels:
      - type:feature
      - area:db
      - area:billing
      - area:api
      - priority:p1
      - phase:1
    body: |
      ## Context

      Spend must be controlled and explainable. Money is integer micros (1 USD = 1,000,000).

      ## Scope

      - Immutable ledger with reserve, capture, release and adjust entries and idempotency keys
      - Wallet balance derived from the ledger
      - WARN and STOP caps, plus low-balance and STOP-cap UI states
      - Policy engine: do-not-call, consent per channel, caps

      ## Acceptance criteria

      - [ ] No float money anywhere
      - [ ] Duplicate webhooks produce one settlement
      - [ ] Ledger invariants have property tests
      - [ ] Balance after reserve, capture and release is exact

      ## Spec reference

      `docs/superpowers/specs/2026-11-11-knoqra-phase1-design.md`, "Build milestones" (M2).
  - title: Add a Telnyx "ignored" webhook outcome
    milestone: M2 Voice
    labels:
      - type:feature
      - area:providers
      - area:api
      - priority:p1
      - phase:1
    body: |
      ## Context

      Telnyx sends many event types KNOQRA does not model. `WebhookAdapter.parse` can only succeed or return `invalid_payload`, so a harmless unknown event would be answered with 400 and retried.

      ## Scope

      - Extend the parse result with an `ignored` outcome
      - Answer 200 for ignored events without storing or enqueueing them
      - Log the ignored event type at debug level

      ## Acceptance criteria

      - [ ] Unknown but well-formed events return 200 and are not queued
      - [ ] Malformed payloads still return 400
      - [ ] Fake provider contract tests updated

      ## Spec reference

      `docs/superpowers/specs/2026-11-11-knoqra-phase1-design.md`, "Tech stack".
  - title: Verify webhook signatures over raw bytes
    milestone: M2 Voice
    labels:
      - type:security
      - area:api
      - area:providers
      - priority:p1
      - phase:1
    body: |
      ## Context

      The webhook route reads the body with `c.req.text()` and verifies over that string. Telnyx signs the exact bytes, and decoding can change them.

      ## Scope

      - Read the body once as an `ArrayBuffer` and pass bytes to `WebhookAdapter.verify`
      - Parse JSON from the same bytes after verification
      - Update the fake provider to sign over the raw bytes, and its tests
      - Avoid parsing the body twice (once in `parse`, once for storage)

      ## Acceptance criteria

      - [ ] A body with non-UTF-8 or unusual whitespace still verifies correctly
      - [ ] A single byte change fails verification
      - [ ] No behavior change for the fake provider

      ## Spec reference

      `docs/superpowers/specs/2026-11-11-knoqra-phase1-design.md`, "Tech stack".
  - title: "Conversations and messages: schema and API"
    milestone: M3 Inbox (SMS & WhatsApp)
    labels:
      - type:feature
      - area:db
      - area:api
      - area:messaging
      - priority:p2
      - phase:1
    body: |
      ## Context

      SMS and WhatsApp share one conversation model per contact.

      ## Scope

      - `Conversation`, `Message` and `MessageTemplate` tables with forced RLS
      - List and send endpoints in the OpenAPI document
      - Inbound message normalization from provider events

      ## Acceptance criteria

      - [ ] Cross-tenant reads and writes are rejected and tested
      - [ ] Messages appear on the Contact 360 timeline
      - [ ] Client regenerated

      ## Spec reference

      `docs/superpowers/specs/2026-11-11-knoqra-phase1-design.md`, "Build milestones" (M3).
  - title: SMS send and receive pipeline with delivery status chain
    milestone: M3 Inbox (SMS & WhatsApp)
    labels:
      - type:feature
      - area:api
      - area:providers
      - area:messaging
      - priority:p2
      - phase:1
    body: |
      ## Context

      Messages move through queued, sent, delivered or failed, driven by provider events.

      ## Scope

      - Send through `MessagingProvider.sendSms` with idempotency keys
      - Apply `message.sent`, `delivered`, `failed` and `received` events
      - STOP and START keywords suppress and restore the channel

      ## Acceptance criteria

      - [ ] A duplicate delivery receipt changes nothing
      - [ ] STOP blocks later sends server-side
      - [ ] Status chain is visible per message

      ## Spec reference

      `docs/superpowers/specs/2026-11-11-knoqra-phase1-design.md`, "Build milestones" (M3).
  - title: WhatsApp 24-hour window and template messages
    milestone: M3 Inbox (SMS & WhatsApp)
    labels:
      - type:feature
      - area:api
      - area:messaging
      - area:compliance
      - priority:p2
      - phase:1
    body: |
      ## Context

      WhatsApp only allows free-form replies inside a 24-hour customer-care window; outside it only approved templates may be sent.

      ## Scope

      - Window tracking from the last inbound message
      - Template storage and selection
      - Server-side enforcement in the policy engine

      ## Acceptance criteria

      - [ ] A free-form send outside the window is refused by the server
      - [ ] Window state is exposed to the UI
      - [ ] Tests use a controllable clock

      ## Spec reference

      `docs/superpowers/specs/2026-11-11-knoqra-phase1-design.md`, "Build milestones" (M3).
  - title: "Inbox UI: threads, composer states and internal notes"
    milestone: M3 Inbox (SMS & WhatsApp)
    labels:
      - type:feature
      - area:web
      - area:messaging
      - priority:p2
      - phase:1
    body: |
      ## Context

      The Desk side of messaging.

      ## Scope

      - Thread list and thread view with Skeleton and Reveal loading
      - Composer states: free, template, paused and blocked, each explaining why
      - Internal notes that never leave KNOQRA
      - Window banner

      ## Acceptance criteria

      - [ ] Composer state always reflects server policy
      - [ ] Notes are visually distinct from messages
      - [ ] E2E covers send, delivery and a blocked state

      ## Spec reference

      `docs/superpowers/specs/2026-11-11-knoqra-phase1-design.md`, "Build milestones" (M3).
  - title: Gate live sending behind 10DLC and Meta approval
    milestone: M3 Inbox (SMS & WhatsApp)
    labels:
      - type:feature
      - area:compliance
      - area:messaging
      - area:api
