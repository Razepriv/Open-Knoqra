  - title: Calls and voicemails follow the target contact on merge
    milestone: M6 Hardening
    labels:
      - type:bug
      - area:api
      - area:db
      - area:telephony
      - priority:p2
      - phase:1
    body: |
      ## Context

      Contact merge re-points timeline and consent events to the target contact, but not `call.contact_id` or `voicemail.contact_id`. After a merge, the source's calls and voicemails stay attached to the merged-away contact.

      ## Scope

      - Re-point `call.contact_id` and `voicemail.contact_id` from the source to the target in the merge transaction, through the composite tenant foreign keys `(organization_id, contact_id)`
      - Add tests for calls and voicemails on a merged contact

      ## Acceptance criteria

      - [ ] After a merge, Recents shows the source's calls under the target contact
      - [ ] After a merge, Voicemail shows the source's voicemails under the target contact
      - [ ] After a merge, the target's timeline shows the source's calls
      - [ ] Tests cover both tables

      ## Spec reference

      `docs/superpowers/specs/2026-11-11-knoqra-phase1-design.md`, "Build milestones" (M6).
