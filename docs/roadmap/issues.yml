      ## Context

      Better Auth tables and `provider_event_raw` are deliberately outside row-level security, so their isolation rests on application code. That reliance is not yet written down as a threat model.

      ## Scope

      - List every table without RLS and who can reach it
      - Document the application-level controls for each (membership re-check, route gating, no tenant query access)
      - Add the model to `SECURITY.md` and `docs/architecture.md`
      - File follow-up issues for any control that is missing

      ## Acceptance criteria

      - [ ] Every non-RLS table has a documented owner and control
